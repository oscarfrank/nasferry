# Paste this into TrueNAS: Apps → Discover Apps → ⋮ → Install via YAML
# After copying this project to /mnt/zeus/ix-applications/copy-server
#
# Name the app: copy-server

name: copy-server

x-portals:
  - host: 10.37.1.10
    name: Dashboard
    path: /
    port: 8080
    scheme: http

services:
  copy-server:
    build:
      context: /mnt/zeus/ix-applications/copy-server
      dockerfile: Dockerfile
    container_name: copy-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - /mnt/zeus/ix-applications/copy-server/.env
    environment:
      DATA_DIR: /data
    volumes:
      - /mnt/zeus:/source:ro
      - /mnt/zeus/ix-applications/copy-server/data:/data
